version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TanStack Start 1.169+ requires Vite 8. Router and plugin are pinned to the
      # exact versions Start bundles; upgrade all of them (and Vite) together by hand.
      - dependency-name: "@tanstack/react-start"
        versions: [">=1.169.0"]
      - dependency-name: "@tanstack/react-router"
      - dependency-name: "@tanstack/router-plugin"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
